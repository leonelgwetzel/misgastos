services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: misgastos
      POSTGRES_PASSWORD: misgastos
      POSTGRES_DB: misgastos
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misgastos -d misgastos"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: build
    command: npm run dev
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./prisma:/app/prisma
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://misgastos:misgastos@db:5432/misgastos
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-production}
      NODE_ENV: development
      PORT: 3000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: .
      target: build
    command: npm run bot:dev
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    environment:
      DATABASE_URL: postgresql://misgastos:misgastos@db:5432/misgastos
      NODE_ENV: development
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_dev:
