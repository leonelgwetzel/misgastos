services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: misgastos
      POSTGRES_PASSWORD: misgastos
      POSTGRES_DB: misgastos
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misgastos -d misgastos"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://misgastos:misgastos@db:5432/misgastos
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-production}
      NODE_ENV: production
      PORT: 3000
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    command: node src/bot/index.js
    environment:
      DATABASE_URL: postgresql://misgastos:misgastos@db:5432/misgastos
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
